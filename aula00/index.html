<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introdução ao CSS</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>
    <h1>INTRODUÇÃO AO CSS</h1>
    <h2>Criando Formulário</h2>
    <nav>
        <ul>
            <li>Home</li>
            <li>Contato</li>
        </ul>
    </nav>
    <form action="">
        <fieldset>
            <legend><h3>Dados Pessoais</h3></legend>
            <label for="nomecompleto">Nome Completo</label><br>
            <input type="text" name="nomecompleto" id="nomecompleto"="6" placeholder="Seu Nome Completo" minlength="6" required><br>

            <label for="datanascimento">Data de Nascimento</label><br>
            <input type="date" name="datanascimento" id="datanascimento" required><br>

            <label for="cpf">CPF</label><br>
            <input type="text" name="cpf" id="cpf" placeholder="000.000.000-00" pattern="[0-9]{3}.[0-9]{3}.[0-9]{3}-[0-9]{2}" required><br>
            
            <label for="rg">RG</label><br>
            <input type="text" name="rg" id="rg" placeholder="00.000.000-0" pattern="[0-9]{2}.[0-9]{3}.[0-9]{3}-[0-9]" required><br>
            
            <label for="email">E-mail</label><br>
            <input type="email" name="email" id="email" placeholder="exemplo@email.com" required><br>
            
            <label for="endereco">Endereço</label><br>
            <input type="text" name="endereco" id="endereco" placeholder="Digite seu Endereço" required><br>
            
            <label for="linkedin">LinkedIn</label><br>
            <input type="url" name="linkedin" id="linkedin" placeholder="Cole o link do seu LinkedIn aqui." required><br>

            <br>

            <button type="submit">Enviar</button>
        </fieldset>
    </form>
</body>

</html>
